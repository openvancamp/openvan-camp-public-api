# Publishes a package when its version tag is pushed:
#   mcp-server-vX.Y.Z → npm @openvancamp/mcp-server + MCP Registry + GitHub Release
#   sdk-vX.Y.Z        → npm @openvancamp/sdk + GitHub Release
#   python-vX.Y.Z     → PyPI openvan + GitHub Release
# The tag version must match package.json. Re-running for an already published
# version skips the steps that are done, so a failed run can simply be retried.
#
# Secrets:
#   NPM_TOKEN                   npm automation token (not needed once npm Trusted Publishing is set up)
# The MCP Registry needs no secret: io.github.openvancamp/openvan-travel belongs to this repository's
# organization, so the workflow logs in with GitHub OIDC (until 0.9.3 the name was io.github.Kopaev/openvan-travel).
# PyPI needs no secret: it trusts this workflow (Trusted Publishing, environment "pypi").

name: Release

on:
  push:
    tags:
      - 'mcp-server-v*'
      - 'sdk-v*'
      - 'python-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. mcp-server-v0.6.0'
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: ${{ !startsWith(inputs.tag || github.ref_name, 'python-v') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve package
        id: pkg
        run: |
          case "$TAG" in
            mcp-server-v*) dir=mcp-server; version="${TAG#mcp-server-v}" ;;
            sdk-v*)        dir=sdk;        version="${TAG#sdk-v}" ;;
            *) echo "Unknown tag $TAG"; exit 1 ;;
          esac
          name=$(jq -r .name "$dir/package.json")
          pkg_version=$(jq -r .version "$dir/package.json")
          if [ "$pkg_version" != "$version" ]; then
            echo "Tag $TAG does not match $dir/package.json version $pkg_version"; exit 1
          fi
          if [ "$dir" = mcp-server ] && [ "$(jq -r .version mcp-server/server.json)" != "$version" ]; then
            echo "mcp-server/server.json version differs from $version"; exit 1
          fi
          if [ "$dir" = mcp-server ] && jq -e --arg v "$version" '[.packages[]? | select(.version != $v)] | length > 0' mcp-server/server.json > /dev/null; then
            echo "mcp-server/server.json packages[].version differs from $version"; exit 1
          fi
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "published=$published" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.pkg.outputs.published == ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish to npm
        if: steps.pkg.outputs.published == ''
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm publish --access public --provenance

      - name: Publish to MCP Registry
        if: steps.pkg.outputs.dir == 'mcp-server'
        working-directory: mcp-server
        run: |
          name=$(jq -r .name server.json)
          version=${{ steps.pkg.outputs.version }}
          if curl -sf "https://registry.modelcontextprotocol.io/v0.1/servers?search=${name#*/}" \
              | jq -e --arg n "$name" --arg v "$version" '.servers[] | select(.server.name == $n and .server.version == $v)' > /dev/null; then
            echo "$name $version is already in the registry"; exit 0
          fi
          # The registry checks the npm package, which shows up on npm a minute or two after publishing.
          for i in $(seq 1 30); do
            [ "$(npm view "${{ steps.pkg.outputs.name }}@$version" version 2>/dev/null)" = "$version" ] && break
            sleep 10
          done
          curl -sL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists"; exit 0
          fi
          # Only MCP server releases take the "Latest" badge on the repository page.
          latest=false
          [ "${{ steps.pkg.outputs.dir }}" = mcp-server ] && latest=true
          gh release create "$TAG" --verify-tag --latest="$latest" \
            --title "${{ steps.pkg.outputs.name }} v${{ steps.pkg.outputs.version }}" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed. npm: [\`${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}\`](https://www.npmjs.com/package/${{ steps.pkg.outputs.name }}/v/${{ steps.pkg.outputs.version }})"

  pypi:
    if: ${{ startsWith(inputs.tag || github.ref_name, 'python-v') }}
    runs-on: ubuntu-latest
    environment: pypi
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check version, test, build
        id: pkg
        working-directory: python-sdk
        run: |
          version="${TAG#python-v}"
          pkg_version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/openvan/client.py').read())[1])")
          if [ "$pkg_version" != "$version" ]; then
            echo "Tag $TAG does not match python-sdk version $pkg_version"; exit 1
          fi
          PYTHONPATH=src python -m unittest discover -s tests
          pip install build
          python -m build
          if curl -sf "https://pypi.org/pypi/openvan/$version/json" > /dev/null; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish to PyPI
        if: steps.pkg.outputs.published != 'yes'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-sdk/dist

      - name: GitHub Release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists"; exit 0
          fi
          gh release create "$TAG" --verify-tag --latest=false \
            --title "Python SDK v${{ steps.pkg.outputs.version }} — pip install openvan" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed. PyPI: [\`openvan ${{ steps.pkg.outputs.version }}\`](https://pypi.org/project/openvan/${{ steps.pkg.outputs.version }}/)"
