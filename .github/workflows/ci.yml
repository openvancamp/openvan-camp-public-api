name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: python-sdk
        run: PYTHONPATH=src python -m unittest discover -s tests

  js:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [sdk, mcp-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: ${{ matrix.package }}
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Skills follow the Agent Skills spec
        run: |
          pip install -q "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          for s in skills/*/; do skills-ref validate "$s"; done
      - name: Plugin manifests carry one version
        run: |
          versions=$(jq -r .version plugin.json .claude-plugin/plugin.json .codex-plugin/plugin.json .cursor-plugin/plugin.json | sort -u)
          echo "$versions"
          [ "$(echo "$versions" | wc -l)" -eq 1 ]
          jq -e . .mcp.json mcp.json .claude-plugin/marketplace.json .cursor-plugin/marketplace.json .agents/plugins/marketplace.json > /dev/null
