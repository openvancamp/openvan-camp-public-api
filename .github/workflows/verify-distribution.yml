# Checks from the outside that every published thing works: npm, PyPI, MCP Registry,
# GitHub Releases, `npx -y @openvancamp/mcp-server`, the hosted MCP endpoint, the SDKs
# against the live API, and the daily data repository. Red badge = something is broken.
name: Verify distribution

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Right after a release npm needs a few minutes before `latest` and the tarball are served;
      # checking at once gives a false red badge.
      - name: Wait for npm to serve the released versions
        if: github.event_name == 'workflow_run'
        run: |
          for pkg in mcp-server sdk; do
            want=$(jq -r .version $pkg/package.json)
            name=$(jq -r .name $pkg/package.json)
            for i in $(seq 1 60); do
              [ "$(npm view "$name" dist-tags.latest 2>/dev/null)" = "$want" ] && break
              sleep 15
            done
          done
          sleep 60
      - name: Verify
        run: bash scripts/verify-distribution.sh
