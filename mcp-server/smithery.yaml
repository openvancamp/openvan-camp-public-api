name: openvan-travel
displayName: OpenVan Travel Data
description: Free vanlife & RV travel data for AI agents — fuel prices (160+ countries), toll roads, holidays and peak traffic days, travel hazards and active fires, power plugs, customs rules, VanSky weather scores, VanBasket food price index, currency rates, events, news stories, visa and vehicle-import rules, license plates of the world. 25 read-only tools. No auth. CC BY 4.0.
version: 0.6.2
license: MIT
homepage: https://openvan.camp/ai
repository:
  type: git
  url: https://github.com/openvancamp/openvan-camp-public-api
  path: mcp-server
author:
  name: OpenVan.camp
  email: hello@openvan.camp
  url: https://openvan.camp

keywords:
  - vanlife
  - rv
  - motorhome
  - travel
  - fuel-prices
  - weather
  - currency
  - food-index
  - events
  - openvan
  - travel-data

categories:
  - travel
  - data

# Remote-hosted transport (преферред для web-клиентов и ChatGPT Apps SDK)
remote:
  type: streamable-http
  url: https://mcp.openvan.camp/mcp

# Local stdio транспорт (преферред для Claude Desktop / Cursor / Windsurf)
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      OPENVAN_API_URL:
        type: string
        default: https://openvan.camp
        description: Base URL of the OpenVan.camp REST API.
      OPENVAN_SOURCE:
        type: string
        default: mcp-server-smithery
        description: Attribution tag appended to every API call as ?source=<tag>.
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@openvancamp/mcp-server"],
      env: {
        OPENVAN_API_URL: config.OPENVAN_API_URL || "https://openvan.camp",
        OPENVAN_SOURCE: config.OPENVAN_SOURCE || "mcp-server-smithery"
      }
    })

tools:
  - get_fuel_prices
  - compare_fuel_prices
  - find_cheapest_fuel
  - get_vansky_weather
  - list_vansky_top
  - list_events
  - get_event
  - search_stories
  - compare_vanbasket
  - get_vanbasket
  - get_currency_rate
  - check_visa_rules
  - get_route_visa_rules
  - get_vehicle_import_rules
  - list_license_plate_countries
  - get_license_plate_country
  - check_license_plate
  - get_license_plate_image
  - get_toll_rates
  - estimate_route_tolls
  - get_holidays
  - get_travel_hazards
  - get_active_fires
  - get_power_plugs
  - get_customs_rules
